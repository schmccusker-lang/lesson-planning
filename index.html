  .lesson-meta { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; }
  .lesson-title { font-size: 21px; font-weight: normal; margin-bottom: 12px; }

  .tag-chip { border-radius: 12px; padding: 2px 10px; font-size: 11px; display: inline-block; margin: 2px; border-width: 1px; border-style: solid; }
  .lesson-body { padding: 22px 24px; }

  .safety-title { font-weight: bold; color: #a04000; margin-bottom: 6px; font-size: 13px; }
  .safety-line { font-size: 13px; color: #7a3000; margin-bottom: 3px; }

  .new-btn { padding: 9px 18px; background: #8b6914; color: #fff; border: none; border-radius: 8px; font-size: 13px; }
  .save-btn { padding: 9px 18px; background: #1c1812; color: #f5e6c8; border: none; border-radius: 8px; font-size: 13px; }

  .saved-body { padding: 14px 20px; }
  .saved-item { padding-bottom: 9px; margin-bottom: 9px; border-bottom: 1px solid #ece8e0; }
  .saved-item:last-child { border-bottom: none; margin-bottom: 0; }
  .saved-title { font-weight: bold; color: #1c1812; font-size: 14px; }
  .saved-meta { font-size: 11px; color: #999; margin-top: 2px; }
  .diagram-label { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: #888; margin: 10px 0 4px; }
  svg.arena-diagram { width: 100%; max-width: 300px; display: block; border: 2px solid #bbb; border-radius: 4px; background: #f8f6f0; }
  .legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 2px; font-size: 11px; color: #666; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 14px; height: 5px; border-radius: 3px; display: inline-block; }
</style>
</head>
<body>

<div class="header">
  <div class="header-sub">Equestrian Coaching Tool</div>
  <h1>🐴 Lesson Plan Generator</h1>
  <p>BHS &middot; USEF &middot; Pony Club best practices</p>
</div>

<div class="container">
  <!-- Controls -->
  <div class="card">
    <div class="ctrl-label">Rider Level</div>
    <div class="btn-row" id="level-btns"></div>
    <div class="ctrl-label">Lesson Type</div>
    <div class="btn-row" id="type-btns"></div>
    <div class="ctrl-label">Focus / Filter <span style="font-weight:normal;letter-spacing:0;text-transform:none;font-size:11px;color:#aaa">(optional — select one or more)</span></div>
    <div class="btn-row" id="tag-btns"></div>
    <button class="generate-btn" onclick="generateLesson()">✨ Generate Lesson Plan</button>
  </div>

  <div id="no-match" class="no-match" style="display:none"></div>
  <div id="lesson-card" style="display:none"></div>
  <div id="saved-section" style="display:none">
    <div class="card" style="padding:0;overflow:hidden">
      <div class="saved-header" onclick="toggleSaved()">
        <span id="saved-label" style="color:#4a3a1a;font-size:14px">📋 Saved Lessons (0)</span>
        <span id="saved-arrow" style="color:#8b6914">▼</span>
      </div>
      <div id="saved-body" class="saved-body" style="display:none"></div>
    </div>
  </div>
</div>

          { name: "Canter Depart on the Correct Lead", duration: "15 min", diagram: "spiral-circle", description: "On a 20m circle, ask for canter from trot. Inside leg at the girth, outside leg slides back, soft inside rein. After each depart, identify: correct lead or not? If wrong, trot, rebalance, try again — never correct with the lead mid-stride.", coachingTips: ["Set up the depart in the corner — the geometry helps","Sit tall and think canter before you apply the aid"], commonMistakes: ["Tipping forward to ask for canter","Collapsing inside hip, which pushes the horse onto the wrong lead"] },
          { name: "Canter Both Reins, Confirm the Lead", duration: "12 min", diagram: "serpentine", description: "Canter a full circle on each rein. After each transition, rider must tell you which lead they\'re on before looking down. Progress to feeling it without looking at all.", coachingTips: ["On the correct lead, your inside hip will naturally swing forward more","Feel it, don\'t just look for it"], commonMistakes: ["Always needing to look down","Losing balance trying to observe the shoulder"] }

          { name: "Trot to Cross-Rail, Single Fence", duration: "12 min", diagram: "single-xrail", description: "Set a small cross-rail (centre no higher than 30cm). Approach in rising trot, adopt a light seat 3 strides out, land and ride large. Repeat on both reins.", coachingTips: ["Count strides aloud to keep a steady rhythm","Allow the horse to jump up to you — don\'t jump ahead of it"], commonMistakes: ["Getting left behind and catching the horse in the mouth","Jumping ahead and tipping onto the neck"] },
          { name: "Placing Pole to Cross-Rail", duration: "12 min", diagram: "single-xrail", description: "Place a placing pole 2.7m before the cross-rail. This regulates the stride and teaches the rider to trust the setup. Approach in rising trot.", coachingTips: ["Soften the rein slightly in the last 2 strides","Land softly in the heel, not the toe"], commonMistakes: ["Interfering with the placing pole stride","Closing the hip angle too early before takeoff"] },

// ── DIAGRAMS (SVG strings) ────────────────────────────────────────────────────
function svgArena(w, h, inner) {
  return `<div class="diagram-label">Arena diagram</div>
    <svg class="arena-diagram" viewBox="0 0 ${w} ${h}">
      <rect x="10" y="10" width="${w-20}" height="${h-20}" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
      ${inner}
    </svg>`;
}
function svgArrow(pts, color) {
  color = color || "#388e3c";
  const d = pts.map((p,i)=>(i===0?"M ":"L ")+p[0]+" "+p[1]).join(" ");
  const last = pts[pts.length-1], prev = pts[pts.length-2];
  const angle = Math.atan2(last[1]-prev[1], last[0]-prev[0])*180/Math.PI;
  return `<path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.7"/>
    <polygon points="0,-4 8,0 0,4" fill="${color}" opacity="0.8" transform="translate(${last[0]},${last[1]}) rotate(${angle})"/>`;
}
function svgPole(x1,y1,x2,y2,color,thick) {
  return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${color||"#8b6914"}" stroke-width="${thick?5:3}" stroke-linecap="round"/>`;
}
function svgXRail(cx,cy,w) {
  w=w||30; const hw=w/2;
  return `<line x1="${cx-hw}" y1="${cy}" x2="${cx+hw}" y2="${cy}" stroke="#c62828" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx-4}" y1="${cy-6}" x2="${cx+4}" y2="${cy+6}" stroke="#c62828" stroke-width="2"/>
    <line x1="${cx-4}" y1="${cy+6}" x2="${cx+4}" y2="${cy-6}" stroke="#c62828" stroke-width="2"/>`;
}
function svgUpright(cx,cy,w,color) {
  w=w||30; const hw=w/2;
  return `<line x1="${cx-hw}" y1="${cy}" x2="${cx+hw}" y2="${cy}" stroke="${color||"#1565c0"}" stroke-width="5" stroke-linecap="round"/>`;
}
function svgOxer(cx,cy,w) {
  w=w||30; const hw=w/2, off=5;
  return `<line x1="${cx-hw}" y1="${cy-off}" x2="${cx+hw}" y2="${cy-off}" stroke="#6a1b9a" stroke-width="4" stroke-linecap="round"/>
    <line x1="${cx-hw}" y1="${cy+off}" x2="${cx+hw}" y2="${cy+off}" stroke="#6a1b9a" stroke-width="4" stroke-linecap="round"/>`;
}
function svgCircle(cx,cy,r,color) {
  return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.55}" fill="none" stroke="${color||"#388e3c"}" stroke-width="1.5" stroke-dasharray="5,3" opacity="0.6"/>`;
}
function svgText(x,y,txt,size,color) {
  return `<text x="${x}" y="${y}" font-size="${size||9}" fill="${color||"#555"}" text-anchor="middle" font-family="Georgia,serif">${txt}</text>`;
}

    svgCircle(140,90,50,"#c8871a") +
    svgCircle(140,90,28,"#c62828") +
    svgArrow([[140,15],[165,30],[185,65],[175,100],[155,120]],"#388e3c") +
    svgArrow([[130,118],[115,100],[110,75],[120,52],[140,42]],"#c8871a") +
    svgText(220,25,"20m","#388e3c",9) + svgText(195,50,"15m","#c8871a",9) +
    svgText(175,75,"10m","#c62828",9) +
    svgText(140,175,"Spiral in (leg yield out)","#888",9)
  ),
  "half-pass": () => svgArena(280,180,
    `<rect x="10" y="10" width="260" height="160" fill="none" stroke="#ccc" stroke-width="1"/>` +
    svgArrow([[15,165],[70,125],[140,90],[210,55],[265,20]],"#6a1b9a") +
    [0,1,2,3].map(i=>svgArrow([[40+i*58,150-i*38],[56+i*58,136-i*38]],"#6a1b9a")).join("") +
    svgText(140,175,"Half-pass on diagonal: bend toward direction of travel","#888",9)
  ),
};

// ── LEGEND ───────────────────────────────────────────────────────────────────
const LEGEND_HTML = `<div class="legend">
  <span class="legend-item"><span class="legend-dot" style="background:#8b6914"></span> Ground pole</span>
  <span class="legend-item"><span class="legend-dot" style="background:#c62828"></span> Cross-rail</span>
  <span class="legend-item"><span class="legend-dot" style="background:#1565c0"></span> Upright</span>
  <span class="legend-item"><span class="legend-dot" style="background:#6a1b9a"></span> Oxer</span>
  <span class="legend-item"><span class="legend-dot" style="background:#388e3c"></span> Track/direction</span>
</div>`;

// ── RENDER ────────────────────────────────────────────────────────────────────
function renderLevelBtns() {
  const c = document.getElementById("level-btns");
  c.innerHTML = LEVELS.map(l => {
    const s = levelStyles[l];
    const active = l === currentLevel;
    return `<button class="level-btn" onclick="setLevel('${l}')" style="border-color:${active?s.accent:'#ddd'};background:${active?s.bg:'#faf8f4'};color:${active?s.text:'#777'};font-weight:${active?'bold':'normal'}">${l}</button>`;
  }).join("");
}
function renderTypeBtns() {
  const c = document.getElementById("type-btns");
  c.innerHTML = TYPES.map(t => {
    const active = t === currentType;
    return `<button class="type-btn" onclick="setType('${t}')" style="border-color:${active?'#1c1812':'#ddd'};background:${active?'#1c1812':'#faf8f4'};color:${active?'#f5e6c8':'#777'}">${t==='Flat'?'🐴':'🏇'} ${t}</button>`;
  }).join("");
}
function renderTagBtns() {
  const c = document.getElementById("tag-btns");
  c.innerHTML = ALL_TAGS.map(tag => {
    const tc = TAG_COLORS[tag];
    const active = activeTags.includes(tag);
    return `<button class="tag-btn" onclick="toggleTag('${tag}')" style="border-color:${active?tc.border:'#ddd'};background:${active?tc.bg:'#faf8f4'};color:${active?tc.text:'#888'};font-weight:${active?'bold':'normal'}">${tag}</button>`;
  }).join("");
}

function renderExBlock(item, accent, showDetails) {
  if (!item) return "";
  const diagramFn = item.diagram && DIAGRAMS[item.diagram];
  const diagramHTML = diagramFn ? (LEGEND_HTML + diagramFn()) : "";
  const tipsHTML = showDetails && item.coachingTips && item.coachingTips.length ?
    `<div class="sub-label" style="color:${accent}">Coaching Tips</div>` +
    item.coachingTips.map(t=>`<div class="tip-line">💡 ${t}</div>`).join("") : "";
  const mistakesHTML = showDetails && item.commonMistakes && item.commonMistakes.length ?
    `<div class="sub-label" style="color:#b03020">Watch For</div>` +
    item.commonMistakes.map(m=>`<div class="mistake-line">⚠️ ${m}</div>`).join("") : "";
  return `<div class="ex-block" style="border-left-color:${accent}">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
      <div class="ex-name">${item.name}</div>
      ${item.duration ? `<div class="ex-duration">⏱ ${item.duration}</div>` : ""}
    </div>
    <div class="ex-desc">${item.description}</div>
    ${diagramHTML}
    ${tipsHTML}
    ${mistakesHTML}
  </div>`;
}

function renderLesson(lesson) {
  const s = levelStyles[currentLevel];
  const goalsHTML = lesson.goals.map(g=>`<span class="goal-chip" style="border-color:${s.accent};color:${s.text}">✓ ${g}</span>`).join("");
  const tagsHTML = lesson.tags.map(tag=>{ const tc=TAG_COLORS[tag]; return `<span class="tag-chip" style="background:${tc.bg};color:${tc.text};border-color:${tc.border}">${tag}</span>`; }).join("");
  const safetyHTML = lesson.safetyReminders && lesson.safetyReminders.length ?
    `<div class="safety-box"><div class="safety-title">⚠️ Safety Reminders</div>${lesson.safetyReminders.map(s=>`<div class="safety-line">• ${s}</div>`).join("")}</div>` : "";

  return `<div style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 18px rgba(0,0,0,0.09);border:1px solid ${s.accent}50;margin-bottom:20px">
    <div class="lesson-header" style="background:${s.bg};border-bottom-color:${s.accent}">
      <div class="lesson-meta" style="color:${s.accent}">${currentType} · ${currentLevel} · ${lesson.duration}</div>
      <div class="lesson-title" style="color:${s.text}">${lesson.title}</div>
      <div style="margin-bottom:8px">${goalsHTML}</div>
      <div>${tagsHTML}</div>
    </div>
    <div class="lesson-body">
      <div class="section-head" style="color:#5c7a5c;border-bottom-color:#5c7a5c30">🌅 Warm-Up</div>
      ${renderExBlock(lesson.warmup,"#5c7a5c",false)}
      <div class="section-head" style="color:${s.accent};border-bottom-color:${s.accent}30">⚡ Main Exercises</div>
      ${lesson.mainExercises.map(ex=>renderExBlock(ex,s.accent,true)).join("")}
      <div class="section-head" style="color:#7a6a5c;border-bottom-color:#7a6a5c30">🌙 Cool-Down</div>
      ${renderExBlock(lesson.cooldown,"#7a6a5c",false)}
      ${lesson.bestPracticeNote ? `<div class="best-practice">📚 <strong>Best Practice:</strong> ${lesson.bestPracticeNote}</div>` : ""}
      ${safetyHTML}
      <div class="action-row">
        <button class="new-btn" onclick="generateLesson()">🔄 New Lesson</button>
        <button class="save-btn" onclick="saveLesson()">💾 Save</button>
      </div>
    </div>
  </div>`;
}

function renderSaved() {
  const sec = document.getElementById("saved-section");
  const lbl = document.getElementById("saved-label");
  const body = document.getElementById("saved-body");
  if (savedLessons.length === 0) { sec.style.display = "none"; return; }
  sec.style.display = "block";
  lbl.textContent = `📋 Saved Lessons (${savedLessons.length})`;
  body.innerHTML = savedLessons.map(s => {
    const tc_html = s.tags.map(tag=>{ const tc=TAG_COLORS[tag]; return `<span class="tag-chip" style="background:${tc.bg};color:${tc.text};border-color:${tc.border};font-size:10px">${tag}</span>`; }).join("");
    return `<div class="saved-item"><div class="saved-title">${s.title}</div><div class="saved-meta">${s._type} · ${s._level} · ${s.duration}</div><div style="margin-top:5px">${tc_html}</div></div>`;
  }).join("");
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
function setLevel(l) { currentLevel=l; currentLesson=null; document.getElementById("lesson-card").style.display="none"; document.getElementById("no-match").style.display="none"; renderLevelBtns(); }
function setType(t)  { currentType=t;  currentLesson=null; document.getElementById("lesson-card").style.display="none"; document.getElementById("no-match").style.display="none"; renderTypeBtns(); }
function toggleTag(tag) {
  if (activeTags.includes(tag)) activeTags=activeTags.filter(t=>t!==tag); else activeTags.push(tag);
  currentLesson=null; document.getElementById("lesson-card").style.display="none"; document.getElementById("no-match").style.display="none";
  renderTagBtns();
}
function generateLesson() {
  const pool = LESSONS[currentLevel][currentType];
  const filtered = activeTags.length===0 ? pool : pool.filter(l=>activeTags.every(t=>l.tags.includes(t)));
  if (filtered.length===0) {
    document.getElementById("no-match").style.display="block";
    document.getElementById("no-match").textContent=`No ${currentLevel} ${currentType} lessons match all selected filters. Try removing a filter or changing the lesson type.`;
    document.getElementById("lesson-card").style.display="none";
    return;
  }
  document.getElementById("no-match").style.display="none";
  const key = currentLevel+"-"+currentType+"-"+activeTags.join(",");
  if (!usedIds[key]) usedIds[key]=[];
  let available = filtered.filter((_,i)=>!usedIds[key].includes(i));
  if (available.length===0) { usedIds[key]=[]; available=filtered; }
  const pick = available[Math.floor(Math.random()*available.length)];
  const pickIdx = filtered.indexOf(pick);
  usedIds[key].push(pickIdx);
  currentLesson = pick;
  const card = document.getElementById("lesson-card");
  card.innerHTML = renderLesson(pick);
  card.style.display = "block";
  card.scrollIntoView({behavior:"smooth",block:"start"});
}
function saveLesson() {
  if (!currentLesson) return;
  if (savedLessons.find(s=>s.title===currentLesson.title && s._level===currentLevel)) return;
  savedLessons.push({...currentLesson, _level:currentLevel, _type:currentType});
  renderSaved();
}
function toggleSaved() {
  savedOpen=!savedOpen;
  document.getElementById("saved-body").style.display=savedOpen?"block":"none";
  document.getElementById("saved-arrow").textContent=savedOpen?"▲":"▼";
}

// ── INIT ──────────────────────────────────────────────────────────────────────
renderLevelBtns();
renderTypeBtns();
renderTagBtns();
</script>
</body>
</html>
